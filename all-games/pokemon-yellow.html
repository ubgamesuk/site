        <section class="game-wrapper">
            <div class="gameframe">
                <div class="gamepanel">
                    <iframe class="game" src="../game/pokemonyellow.html" #000 none; name="game" scrolling="no" frameborder="0" marginheight="0px" marginwidth="0px" allowfullscreen></iframe>
                    <div class="game-controls">
                        <h1 class="gametitle">Pokémon: Yellow Version</h1>
                        <div class="controlbuttons">
                            <button class="fullscreen"><i class='bx bx-fullscreen icon'></i> Fullscreen</button>
                            <script src="../fullscreen.js"></script>

                            <button id="favButton" class="fav-btn"></button>
                            <script type="module">
                                import { games, addFavourite, removeFavourite, isFavourite, showFavouritePopup } from "../recentlyplayed.js";
                                const game = games.pokemonyellow;
                                const favButton = document.getElementById("favButton");

                                    function updateButton() {
                                if (isFavourite(game.id)) {
                                    favButton.innerHTML = "<i class='bx bxs-star icon'></i>";
                                    favButton.classList.add("active");
                                } else {
                                    favButton.innerHTML = "<i class='bx bx-star icon'></i>";
                                    favButton.classList.remove("active");
                                }}
                            favButton.addEventListener("click", () => {
                                if (isFavourite(game.id)) {
                                    removeFavourite(game.id);
                                } else {
                                    addFavourite(game);
                                    showFavouritePopup();
                                }
                                updateButton();
                            });
                            updateButton();
                </script>

                    </div>
